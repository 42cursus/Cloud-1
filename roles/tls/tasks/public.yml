---
- name: Validate Let's Encrypt configuration
  ansible.builtin.assert:
    that:
      - cloud1_letsencrypt_email | length > 3
      - cloud1_domain is not match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
      - "':' not in cloud1_domain"
    fail_msg: Let's Encrypt requires a public DNS hostname and contact email.
  when: cloud1_tls_mode == "letsencrypt"

- name: Request the Let's Encrypt certificate
  ansible.builtin.command:
    argv:
      - certbot
      - certonly
      - --webroot
      - --webroot-path
      - "{{ cloud1_acme_dir }}"
      - --non-interactive
      - --agree-tos
      - --email
      - "{{ cloud1_letsencrypt_email }}"
      - --domain
      - "{{ cloud1_domain }}"
    creates: "/etc/letsencrypt/live/{{ cloud1_domain }}/fullchain.pem"
  when: cloud1_tls_mode == "letsencrypt"

- name: Install the certificate renewal hook
  ansible.builtin.template:
    src: cloud1-renew.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/cloud1-renew
    owner: root
    group: root
    mode: "0750"
  when: cloud1_tls_mode == "letsencrypt"

- name: Activate the Let's Encrypt certificate
  ansible.builtin.copy:
    src: "/etc/letsencrypt/live/{{ cloud1_domain }}/fullchain.pem"
    dest: "{{ cloud1_tls_dir }}/fullchain.pem"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when: cloud1_tls_mode == "letsencrypt"
  notify: Reload Cloud-1 Nginx

- name: Activate the Let's Encrypt private key
  ansible.builtin.copy:
    src: "/etc/letsencrypt/live/{{ cloud1_domain }}/privkey.pem"
    dest: "{{ cloud1_tls_dir }}/privkey.pem"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  when: cloud1_tls_mode == "letsencrypt"
  notify: Reload Cloud-1 Nginx
