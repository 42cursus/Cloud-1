---
- name: Generate missing runtime secrets
  ansible.builtin.shell:
    cmd: >-
      umask 077 &&
      openssl rand -base64 36 > {{ cloud1_secrets_dir }}/{{ item }}
    creates: "{{ cloud1_secrets_dir }}/{{ item }}"
  loop:
    - mariadb_root_password
    - wordpress_db_password
    - wordpress_admin_password
    - phpmyadmin_basic_auth
  no_log: true

- name: Restrict root-only runtime secret permissions
  ansible.builtin.file:
    path: "{{ cloud1_secrets_dir }}/{{ item }}"
    state: file
    owner: root
    group: root
    mode: "0600"
  loop:
    - mariadb_root_password
    - phpmyadmin_basic_auth
  no_log: true

- name: Allow container runtimes to read WordPress secrets
  ansible.builtin.file:
    path: "{{ cloud1_secrets_dir }}/{{ item }}"
    state: file
    owner: root
    group: root
    mode: "0644"
  loop:
    - wordpress_db_password
    - wordpress_admin_password
  no_log: true

- name: Generate the phpMyAdmin basic-auth file
  ansible.builtin.shell:
    cmd: >-
      umask 077 &&
      htpasswd -B -c -i
      {{ cloud1_secrets_dir }}/phpmyadmin.htpasswd
      {{ cloud1_phpmyadmin_basic_user }}
      < {{ cloud1_secrets_dir }}/phpmyadmin_basic_auth
    creates: "{{ cloud1_secrets_dir }}/phpmyadmin.htpasswd"
  no_log: true

- name: Restrict the phpMyAdmin basic-auth file
  ansible.builtin.file:
    path: "{{ cloud1_secrets_dir }}/phpmyadmin.htpasswd"
    state: file
    owner: root
    group: root
    mode: "0644"
