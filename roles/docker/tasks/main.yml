---
- name: Validate the Docker architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture in cloud1_docker_architectures
    fail_msg: "Unsupported Docker architecture: {{ ansible_architecture }}"

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker's repository signing key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
    force: false

- name: Configure Docker's apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ cloud1_docker_architectures[ansible_architecture] }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: true

- name: Install Docker Engine and Compose
  ansible.builtin.apt:
    name:
      - containerd.io
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
    state: present

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Verify the Docker Compose plugin
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - version
  changed_when: false
